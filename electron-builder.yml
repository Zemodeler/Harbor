appId: com.harbor.desktop
productName: Harbor
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
publish:
  - provider: github
    owner: Zemodeler
    repo: Harbor
    releaseType: release
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  executableName: Harbor
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true
nsis:
  artifactName: Harbor-Setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Harbor
  uninstallDisplayName: Harbor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
