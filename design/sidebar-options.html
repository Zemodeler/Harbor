<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor sidebar options</title>
<style>
  :root { color-scheme: light dark; --page:#e9eef0; --page-ink:#152d35; --page-muted:#526775;
    --bg:#fff; --side:#f4f6f7; --surface:#f6f8f9; --ink:#152d35; --muted:#526775; --line:#d9e1e6;
    --accent:#086e70; --wash:#e3f0ee; --on-accent:#fff; --error:#a42828; --warn:#9a5b00; }
  [data-theme=dark] { --page:#0d1417; --page-ink:#e8f0f3; --page-muted:#abc0cb;
    --bg:#171f23; --side:#131b1f; --surface:#212b30; --ink:#e8f0f3; --muted:#abc0cb; --line:#35444c;
    --accent:#91d0c4; --wash:#223e38; --on-accent:#102824; --error:#ffb4ab; --warn:#e8b866; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 'Segoe UI', system-ui, sans-serif; background:var(--page); color:var(--page-ink); }
  button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header.top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 32px 6px; flex-wrap:wrap; }
  header.top h1 { margin:0; font-size:20px; letter-spacing:-.4px; }
  header.top p { margin:4px 0 0; color:var(--page-muted); font-size:13px; }
  .toggle { border:1px solid var(--line); border-radius:8px; padding:7px 12px; background:var(--bg); color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:28px; padding:20px 32px 40px; align-items:start; }
  figure { margin:0; }
  figcaption { margin:0 0 12px; }
  figcaption b { display:block; font-size:15px; }
  figcaption span { color:var(--page-muted); font-size:13px; }
  .frame { width:fit-content; max-width:100%; height:640px; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; background:var(--bg); }
  .side { width:292px; max-width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }
  .main { flex:1; display:none; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:21px; letter-spacing:-.7px; }
  .brand i { width:22px; height:22px; border-radius:6px; background:var(--accent); display:inline-block; position:relative; }
  .brand i::after { content:''; position:absolute; left:5px; right:5px; bottom:5px; height:2px; background:var(--on-accent); box-shadow:0 -5px 0 var(--on-accent), 0 -10px 0 -0px transparent; }
  .scroll { overflow-y:auto; min-height:0; flex:1; }
  .foot { display:grid; gap:2px; padding:10px 14px 14px; }
  .foot button { padding:6px 10px; border-radius:6px; color:var(--muted); }
  .foot button:hover { background:var(--wash); color:var(--ink); }
  .foot small { color:var(--muted); font-size:12px; padding:8px 10px 0; border-top:1px solid var(--line); margin-top:6px; }
  .dot { width:7px; height:7px; border-radius:50%; flex:none; border:1.5px solid var(--muted); }
  .dot.working { background:var(--accent); border-color:var(--accent); animation:tide 2.4s ease-in-out infinite; }
  .dot.done { background:var(--accent); border-color:var(--accent); }
  .dot.failed { background:var(--error); border-color:var(--error); }
  .dot.waiting { border-color:var(--warn); }
  @keyframes tide { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot.working { animation:none; } }

  /* ---------- A: Mooring line ---------- */
  .A { background:var(--side); border-right:1px solid var(--line); padding:24px 14px 0; gap:16px; }
  .A .brand { padding:0 10px; }
  .A .search { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); font:inherit; font-size:12px; }
  .A .label { display:flex; justify-content:space-between; align-items:center; padding:0 4px 0 12px; font-size:12px; font-weight:600; color:var(--muted); }
  .A .label button { padding:2px 8px; font-size:16px; line-height:1.2; border-radius:6px; color:var(--muted); }
  .A .proj { display:flex; gap:8px; align-items:center; width:100%; padding:7px 12px; font-weight:600; border-radius:6px; }
  .A .proj em { font-style:normal; width:10px; color:var(--muted); font-weight:400; }
  .A .spine { margin:2px 0 8px 17px; padding-left:12px; border-left:1px solid var(--line); display:grid; gap:2px; }
  .A .new { padding:6px 10px; font-size:12px; font-weight:600; color:var(--accent); border-radius:6px; }
  .A .row { position:relative; }
  .A .conv { width:100%; padding:7px 28px 7px 10px; font-size:12.5px; line-height:1.4; color:var(--muted); border-radius:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .A .conv:hover { background:var(--wash); color:var(--ink); }
  .A .row.sel .conv { color:var(--ink); font-weight:600; background:transparent; }
  .A .row.sel::before { content:''; position:absolute; left:-13px; top:6px; bottom:6px; width:2px; border-radius:2px; background:var(--accent); }
  .A .x { position:absolute; right:2px; top:50%; transform:translateY(-50%); padding:0 7px; opacity:0; color:var(--muted); border-radius:6px; }
  .A .row:hover .x, .A .x:focus-visible { opacity:1; }
  .A .agents { margin:2px 0 6px 10px; font-size:12px; color:var(--muted); }
  .A .agents > div { display:flex; align-items:center; gap:4px; }
  .A .agents .a { display:flex; gap:8px; align-items:flex-start; flex:1; padding:5px 6px; border-radius:6px; color:var(--ink); }
  .A .agents .a:hover { background:var(--wash); }
  .A .agents .dot { margin-top:5px; }
  .A .agents small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  .A .stop { padding:2px 8px; font-size:11.5px; color:var(--muted); opacity:0; border-radius:6px; }
  .A .agents > div:hover .stop, .A .stop:focus-visible { opacity:1; }
  .A .stop:hover { color:var(--error); }

  /* ---------- B: Ship's log ---------- */
  .B { background:#eef2f4; border-right:1px solid var(--line); padding:22px 0 0; --side:#eef2f4; }
  [data-theme=dark] .B { background:#10181c; }
  .B .head { padding:0 20px 14px; border-bottom:1px solid var(--line); }
  .B .proj { font:600 22px/1.15 Georgia, 'Iowan Old Style', serif; letter-spacing:-.4px; margin:14px 0 4px; }
  .B .path { font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .B .start { margin:14px 20px 4px; width:calc(100% - 40px); padding:9px 12px; border:1px solid var(--accent); color:var(--accent); border-radius:6px; font-weight:600; text-align:center; }
  .B .start:hover { background:var(--wash); }
  .B .day { padding:16px 20px 6px; font:italic 13px Georgia, serif; color:var(--muted); }
  .B .entry { display:grid; grid-template-columns:44px 1fr; gap:0 10px; width:100%; padding:9px 20px; position:relative; }
  .B .entry:hover { background:var(--wash); }
  .B .entry time { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px; }
  .B .entry .t { font-size:13px; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .B .entry .m { grid-column:2; display:flex; align-items:center; gap:7px; margin-top:4px; font-size:11.5px; color:var(--muted); }
  .B .entry.sel { background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
  .B .entry.sel .t { font-weight:600; }

  /* ---------- C: Deck ---------- */
  .C { flex-direction:row; width:auto; background:var(--side); border-right:1px solid var(--line); }
  .C .rail { width:60px; flex:none; background:#0f2a2e; display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:10px; }
  [data-theme=dark] .C .rail { background:#0a1215; }
  .C .rail .chip { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:700; font-size:13px; color:#cfe3e1; background:rgba(255,255,255,.07); position:relative; }
  .C .rail .chip.on { background:#91d0c4; color:#0f2a2e; }
  .C .rail .chip.on::before { content:''; position:absolute; left:-11px; top:9px; bottom:9px; width:3px; border-radius:3px; background:#91d0c4; }
  .C .rail .sp { flex:1; }
  .C .panel { width:232px; display:flex; flex-direction:column; min-height:0; }
  .C .panel h2 { margin:0; font-size:15px; padding:18px 16px 2px; }
  .C .panel .sub { padding:0 16px 12px; font-size:11.5px; color:var(--muted); }
  .C .live { margin:0 10px 8px; padding:10px 12px; border-radius:10px; background:var(--wash); display:grid; gap:7px; }
  .C .live .lh { font-size:11.5px; font-weight:600; color:var(--accent); display:flex; align-items:center; gap:7px; }
  .C .live .ag { display:grid; gap:5px; }
  .C .live .ag b { font-weight:600; font-size:12.5px; display:flex; justify-content:space-between; gap:8px; }
  .C .live .ag span { font-size:11px; color:var(--muted); }
  .C .bar { height:3px; border-radius:2px; background:var(--line); overflow:hidden; }
  .C .bar i { display:block; height:100%; width:42%; background:var(--accent); border-radius:2px; }
  .C .stop { font-size:11.5px; color:var(--muted); padding:0 4px; border-radius:4px; }
  .C .stop:hover { color:var(--error); }
  .C .grp { padding:12px 16px 4px; font-size:11.5px; color:var(--muted); font-weight:600; }
  .C .c { width:100%; padding:7px 16px; font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .C .c:hover { color:var(--ink); background:var(--wash); }
  .C .c.sel { color:var(--ink); font-weight:600; background:var(--bg); }
  .C .newc { margin:6px 10px 0; padding:8px 12px; border-radius:8px; background:var(--accent); color:var(--on-accent); font-weight:600; font-size:12.5px; text-align:center; }
  .C .newc:hover { filter:brightness(.92); }
  .C .foot { padding:8px 10px 12px; }
  .C .foot small { border-top:0; }
</style>
</head>
<body>
<header class="top">
  <div><h1>Harbor sidebar: three directions</h1><p>All three use the same data and the current teal. Click rows to try selection; hover for actions.</p></div>
  <button class="toggle" id="theme">Switch to dark</button>
</header>

<div class="grid">

<figure>
  <figcaption><b>A · Mooring line</b><span>The tree is the design. One thin line per project; conversations hang off it, agents sit under the active one. Quietest, closest to today's structure.</span></figcaption>
  <div class="frame"><nav class="side A" aria-label="Option A">
    <div class="brand"><i></i>Harbor</div>
    <input class="search" placeholder="Search projects…" aria-label="Search projects">
    <div class="label"><span>Projects</span><button aria-label="Add project">+</button></div>
    <div class="scroll">
      <button class="proj"><em>⌄</em>RoutingManager</button>
      <div class="spine" data-group>
        <button class="new">New conversation</button>
        <div class="row sel"><button class="conv" data-pick>other: Analyse the project</button><button class="x" aria-label="Delete">×</button>
          <div class="agents"><div><button class="a"><span class="dot working"></span><span>Analyse the project<small>working · codex / default</small></span></button><button class="stop">Stop</button></div></div>
        </div>
        <div class="row"><button class="conv" data-pick>How is the Harbor project going? Are you connected to Claude and Codex and what limits are left today?</button><button class="x" aria-label="Delete">×</button></div>
        <div class="row"><button class="conv" data-pick>Fix the usage meter rounding</button><button class="x" aria-label="Delete">×</button></div>
      </div>
      <button class="proj"><em>›</em>Website</button>
      <button class="proj"><em>›</em>Invoices</button>
    </div>
    <div class="foot"><button>Add project</button><button>Settings</button><small>Local workspace</small></div>
  </nav></div>
</figure>

<figure>
  <figcaption><b>B · Ship's log</b><span>The sidebar shows one project at a time, as a dated log. Time on the left, title and status under it. Reads like a record of work rather than a file tree.</span></figcaption>
  <div class="frame"><nav class="side B" aria-label="Option B">
    <div class="head">
      <div class="brand"><i></i>Harbor</div>
      <div class="proj">RoutingManager</div>
      <div class="path">C:\Users\andrei\Documents\RoutingManager</div>
    </div>
    <button class="start">New conversation</button>
    <div class="scroll">
      <div class="day">Today</div>
      <div class="entry sel" data-pick tabindex="0" role="button"><time>14:20</time><span class="t">other: Analyse the project</span><span class="m"><span class="dot working"></span>codex is working · <button class="stop" style="color:var(--muted);text-decoration:underline">Stop</button></span></div>
      <button class="entry" data-pick><time>11:05</time><span class="t">How is the Harbor project going? Are you connected to Claude and Codex and what limits are left today?</span><span class="m"><span class="dot done"></span>Finished</span></button>
      <div class="day">Yesterday</div>
      <button class="entry" data-pick><time>17:48</time><span class="t">Fix the usage meter rounding</span><span class="m"><span class="dot done"></span>Finished</span></button>
      <button class="entry" data-pick><time>09:12</time><span class="t">Review the installer config</span><span class="m"><span class="dot failed"></span>Failed · claude</span></button>
    </div>
    <div class="foot"><button>Switch project</button><button>Settings</button><small>Local workspace</small></div>
  </nav></div>
</figure>

<figure>
  <figcaption><b>C · Deck</b><span>Projects become a slim rail; the panel is only about the open project. Running agents get their own strip at the top, since that is what you check first.</span></figcaption>
  <div class="frame"><nav class="side C" aria-label="Option C">
    <div class="rail">
      <div class="brand" style="margin-bottom:8px"><i></i></div>
      <button class="chip on" title="RoutingManager">RM</button>
      <button class="chip" title="Website">WS</button>
      <button class="chip" title="Invoices">IN</button>
      <button class="chip" title="Add project" style="font-size:18px;font-weight:400">+</button>
      <div class="sp"></div>
      <button class="chip" title="Settings" style="font-size:15px">⚙</button>
    </div>
    <div class="panel">
      <h2>RoutingManager</h2><div class="sub">3 conversations</div>
      <div class="live">
        <div class="lh"><span class="dot working"></span>1 agent working</div>
        <div class="ag"><b>Analyse the project <button class="stop">Stop</button></b><span>codex / default · 3 min</span><div class="bar"><i></i></div></div>
      </div>
      <button class="newc">New conversation</button>
      <div class="scroll">
        <div class="grp">Recent</div>
        <button class="c sel" data-pick>other: Analyse the project</button>
        <button class="c" data-pick>How is the Harbor project going? Are you connected to Claude and Codex and what limits are left today?</button>
        <div class="grp">Earlier</div>
        <button class="c" data-pick>Fix the usage meter rounding</button>
        <button class="c" data-pick>Review the installer config</button>
      </div>
      <div class="foot"><small>Local workspace</small></div>
    </div>
  </nav></div>
</figure>

</div>
<script>
  const root = document.documentElement, btn = document.getElementById('theme');
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  function set(d){ root.dataset.theme = d ? 'dark' : 'light'; btn.textContent = d ? 'Switch to light' : 'Switch to dark'; }
  set(dark); btn.onclick = () => set(root.dataset.theme !== 'dark');
  document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const nav = b.closest('nav');
    nav.querySelectorAll('.sel').forEach(e => e.classList.remove('sel'));
    (b.closest('.row') || b).classList.add('sel');
  }));
</script>
</body>
</html>
